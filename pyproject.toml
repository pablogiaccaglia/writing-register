[project]
name = "writing-register"
version = "1.2.4"
description = "Make Claude Code write like a careful colleague: the humanizer patterns and your own voice, automatic rewrites, and a rewrite checked against the code."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
wr = "writing_register.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "private/test*"]
addopts = "-q"
